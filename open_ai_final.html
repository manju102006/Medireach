<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HealthAssist — Chatbot</title>
  <style>
    :root {
      --bg: #e6f9f0;
      --panel: #dff5ff;
      --text: #063b3b;
      --muted: #3d6d6d;
      --accent: #16a34a;
      --danger: #ef4444;
      --ring: rgba(59,130,246,.35);
    }
    * { box-sizing: border-box }
    body {
      margin: 0; background: radial-gradient(1200px 600px at 20% 0%, #d4f9e6, #cdefff 100%);
      color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, sans-serif;
      min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    }
    .app {
      width: 100%; max-width: 820px; background: #f0fcff;
      border: 1px solid rgba(0,0,0,.06); border-radius: 20px; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,.15);
      display: flex; flex-direction: column;
    }
    header { padding: 16px 18px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid rgba(0,0,0,.08) }
    header .logo {
      width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center;
      background: linear-gradient(135deg, rgba(34,197,94,.15), transparent 60%), #e0f7ff;
      border: 1px solid rgba(0,0,0,.08);
    }
    h1 { font-size: 18px; margin: 0 }
    .tiny { color: var(--muted); font-size: 12px; margin-top: 2px }
    #chat {
      padding: 18px; overflow-y: auto; scroll-behavior: smooth;
      display: flex; flex-direction: column; gap: 12px; flex: 1;
    }
    .msg { padding: 12px 14px; border-radius: 14px; width: fit-content; max-width: 88%;
           line-height: 1.4; border: 1px solid rgba(0,0,0,.08); animation: fadeIn .3s ease }
    .user   { align-self: flex-end; background: rgba(0,0,0,.08) }
    .bot    { align-self: flex-start; background: rgba(34,197,94,.15) }
    .alert  { border-color: rgba(239,68,68,.6); background: rgba(239,68,68,.12); font-weight: bold }
    .typing { font-size: 13px; color: var(--muted); font-style: italic }
    .footer {
      padding: 12px; display: grid; gap: 8px; border-top: 1px solid rgba(0,0,0,.08);
      background: linear-gradient(0deg, rgba(0,0,0,.03), transparent);
    }
    .row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px }
    input[type="text"] {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(0,0,0,.1);
      background: #e8fdf4; color: var(--text); outline: none; transition: .2s;
    }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring) }
    button {
      padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(0,0,0,.1);
      background: #dff7ff; color: var(--text); cursor: pointer; transition: .2s;
    }
    button:hover { opacity: .85 }
    button.primary { background: linear-gradient(135deg, #3b82f6, #16a34a 60%); border: none; color: #fff; font-weight: 700 }
    button.warn { background: linear-gradient(135deg, #0ea5e9, #38bdf8 65%); border: none; color: #fff; font-weight: 700 }
    .disclaimer { padding: 10px 14px; font-size: 12px; color: var(--muted); text-align: center }
    @keyframes fadeIn { from {opacity:0; transform:translateY(4px)} to{opacity:1; transform:none} }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">🩺</div>
      <div>
        <h1>HealthAssist</h1>
        <div class="tiny">General health chatbot • Not medical advice • <a href="dashboard.html">Dashboard</a></div>
      </div>
    </header>

    <div id="chat">
      <div class="msg bot">
        Hi 👋 I’m here to help with general health guidance.<br>
        <span style="color:#3d6d6d;font-size:13px">Try: “I have a sore throat”, “I feel chest pain”, or “stomach ache”.</span>
      </div>
    </div>

    <div class="footer">
      <div class="row">
        <input id="input" type="text" placeholder="Describe your symptoms..." autocomplete="off" />
        <button id="voiceBtn" title="Voice input">🎙</button>
        <button id="nearbyBtn" class="warn" title="Find nearby hospitals">🏥</button>
        <button id="sendBtn" class="primary">Send</button>
      </div>
      <div class="disclaimer">⚠ Emergency? Call local emergency services (e.g., 108 in India). This runs in your browser only.</div>
    </div>
  </div>

  <script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const nearbyBtn = document.getElementById('nearbyBtn');
  const voiceBtn = document.getElementById('voiceBtn');

  const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // html=true only for trusted markup built in this file; user text and Wikipedia text are always escaped first.
  function addMsg(text, who = 'bot', extraClass = '', html = false) {
    const div = document.createElement('div');
    div.className = `msg ${who} ${extraClass}`.trim();
    if (html) div.innerHTML = text; else div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.textContent = "Typing...";
    div.id = "typing";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  // Emergency red-flags
  const DANGER_SIGNS = [
    /chest (pain|tight|pressure)/i,
    /(severe|worst) headache/i,
    /short(ness)? of breath/i,
    /(difficulty|trouble) (breathing|respir(ing|ation))/i,
    /loss of consciousness|faint/i,
    /seizure|convulsion/i,
    /suicid(e|al)|self\-harm/i,
  ];

  function detectEmergency(text) {
    return DANGER_SIGNS.some(rx => rx.test(text));
  }

  // 🔍 Look up general information on Wikipedia: search first, because free text such as
  // "I have a sore throat" is not an article title (the old direct-title lookup returned 404).
  async function fetchSuggestion(query) {
    try {
      const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch=${encodeURIComponent(query)}`;
      const sres = await fetch(searchUrl);
      if (!sres.ok) throw new Error('search failed');
      const hit = (await sres.json()).query?.search?.[0];
      if (!hit) return `I couldn't find specific details for "${esc(query)}". Please consult a doctor for proper guidance.`;
      const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(hit.title)}`);
      if (!res.ok) throw new Error('summary failed');
      const data = await res.json();
      if (!data.extract) throw new Error('empty');
      return `<b>${esc(data.title)}</b><br>${esc(data.extract)}<br><br><b>Note:</b> This is general encyclopedia information, not a diagnosis. Please consult a doctor for personalized medical advice.`;
    } catch {
      return `Sorry, I couldn't fetch reliable details for "${esc(query)}" right now. Please consult a doctor.`;
    }
  }

  async function handleSend() {
    const qRaw = input.value.trim();
    if (!qRaw) return;
    input.value = '';
    addMsg(qRaw, 'user');
    addTyping();
    if (detectEmergency(qRaw)) {
      removeTyping();
      addMsg("⚠ This may be urgent. Please seek immediate medical attention or call local emergency services (108 in India).", 'bot', 'alert');
      return;
    }
    const suggestion = await fetchSuggestion(qRaw);
    removeTyping();
    addMsg(suggestion, 'bot', '', true);
  }

  // Nearby hospitals
  function openNearbyHospitals() {
    if (!navigator.geolocation) {
      window.open('https://www.google.com/maps/search/hospital+near+me', '_blank');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude, longitude } = pos.coords;
        const url = `https://www.google.com/maps/search/hospital/@${latitude},${longitude},14z`;
        window.open(url, '_blank');
      },
      () => window.open('https://www.google.com/maps/search/hospital+near+me', '_blank')
    );
  }

  // Voice recognition
  function startVoice() {
    if (!('webkitSpeechRecognition' in window)) {
      alert("Speech recognition not supported in this browser.");
      return;
    }
    const recognition = new webkitSpeechRecognition();
    recognition.lang = "en-US";
    recognition.start();
    recognition.onerror = () => addMsg('Sorry, I could not hear that. Please try again or type your message.', 'bot');
    recognition.onresult = (e) => {
      input.value = e.results[0][0].transcript;
      handleSend();
    };
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });
  nearbyBtn.addEventListener('click', openNearbyHospitals);
  voiceBtn.addEventListener('click', startVoice);
  </script>
</body>
</html>
