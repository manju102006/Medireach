
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Healthcare Login</title>

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(-45deg, #e3f2fd, #bbdefb, #c8e6c9, #a5d6a7);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      position: relative;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .decor {
      position: absolute;
      opacity: 0.1;
      animation: float 6s ease-in-out infinite;
    }

    .cross {
      font-size: 80px;
      color: #0d47a1;
    }

    .heart {
      font-size: 60px;
      color: #d32f2f;
      left: 20%;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .box {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(20px);
      padding: 40px 30px;
      border-radius: 20px;
      width: 350px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 1;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .box img {
      width: 80px;
      margin-bottom: 15px;
      animation: heartbeat 2s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    h2 {
      color: #1565c0;
      margin-bottom: 18px;
      font-weight: 600;
      font-size: 1.8rem;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.2);
      background: rgba(255,255,255,0.85);
      transition: all 0.3s ease;
      outline: none;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #1565c0;
      box-shadow: 0 0 6px rgba(21,101,192,0.5);
      background: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(to right, #43cea2, #1565c0);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, #1565c0, #43cea2);
      transform: scale(1.03);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .finger-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      background: linear-gradient(to right, #2e7d32, #43a047);
    }

    .finger-btn:hover {
      background: linear-gradient(to right, #43a047, #2e7d32);
    }

    .finger-btn img {
      width: 20px;
      height: 20px;
    }

    .signup-link {
      margin-top: 15px;
      display: block;
      color: #0d47a1;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }

    .signup-link:hover {
      text-decoration: underline;
      color: #2e7d32;
    }

    .msg {
      margin-top: 10px;
      font-size: 14px;
      min-height: 18px;
      color: #b91c1c;
      font-weight: 600;
    }

    .msg.info {
      color: #1565c0;
    }

    button:disabled {
      opacity: .7;
      cursor: not-allowed;
    }
  </style>

  <!-- Firebase SDK Version 8.10.0 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- Firebase Configuration -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCtjfuunPvAKEc-9iBl2VI1D89X4NrhXgE",
      authDomain: "medireach-700fc.firebaseapp.com",
      databaseURL: "https://medireach-700fc-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "medireach-700fc",
      storageBucket: "medireach-700fc.firebasestorage.app",
      messagingSenderId: "946051383153",
      appId: "1:946051383153:web:cf8c290bd8eb5e92e980d0",
      measurementId: "G-S9CKBQHT84"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const database = firebase.database();
  </script>
</head>

<body>

  <!-- Background Decorations -->
  <div class="decor cross" style="top:10%; left:10%;">✚</div>
  <div class="decor heart" style="bottom:15%; right:15%;">❤</div>

  <!-- Login Form -->
  <div class="box">

    <img
      src="https://cdn-icons-png.flaticon.com/512/2966/2966482.png"
      alt="Healthcare Icon"
    >

    <h2>Patient Login</h2>

    <form onsubmit="login(event)">

      <input
        type="text"
        id="name"
        placeholder="Full Name"
        autocomplete="name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginBtn">Login</button>

    </form>

    <!-- Fingerprint Login -->
    <button
      type="button"
      class="finger-btn"
      onclick="fingerprintLogin(event)"
    >
      <img
        src="https://cdn-icons-png.flaticon.com/512/565/565547.png"
        alt=""
      >
      Login with Fingerprint
    </button>

    <p id="msg" class="msg" role="alert"></p>

    <a href="sign_up.html" class="signup-link">
      Don't have an account? Sign up
    </a>

  </div>

  <script>

    const msg = document.getElementById("msg");

    // Display Messages
    function showMsg(message, info) {
      msg.textContent = message;
      msg.className = "msg" + (info ? " info" : "");
    }

    // Login Function
    function login(event) {

      event.preventDefault();

      const btn = document.getElementById("loginBtn");

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      showMsg("");

      if (name.length < 3) {
        showMsg("Please enter a valid name (min 3 characters).");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Logging in...";

      auth.signInWithEmailAndPassword(email, password)

        .then((credential) => {

          const user = credential.user;
          const uid = user.uid;

          // Save login details locally
          localStorage.setItem("uid", uid);
          localStorage.setItem("name", name);
          localStorage.setItem("username", name);
          localStorage.setItem("email", user.email);

          // Retrieve user profile from Firebase
          return database.ref("users/" + uid).once("value")

            .then((snapshot) => {

              const profile = snapshot.val() || {};

              // Prefer the registered name from Firebase
              const savedName = profile.name || name;

              localStorage.setItem("name", savedName);
              localStorage.setItem("username", savedName);

              // Update last login information
              return database.ref("users/" + uid).update({
                name: savedName,
                email: user.email,
                lastLogin: new Date().toISOString()
              });

            })

            .then(() => {

              // Redirect after successful login
              window.location.href = "dashboard.html";

            });

        })

        .catch((error) => {

          console.error("Firebase Login Error:", error);

          const friendlyMessages = {
            "auth/wrong-password": "Incorrect email or password.",
            "auth/user-not-found": "Incorrect email or password.",
            "auth/invalid-credential": "Incorrect email or password.",
            "auth/invalid-login-credentials": "Incorrect email or password.",
            "auth/too-many-requests": "Too many attempts. Please try again later.",
            "auth/network-request-failed": "Network error. Check your internet connection."
          };

          showMsg(
            friendlyMessages[error.code] ||
            "Login failed: " + error.message
          );

          btn.disabled = false;
          btn.innerText = "Login";

        });

    }

    // Fingerprint Login
    // Real fingerprint authentication requires a secure WebAuthn server setup.
    // Until then, this button does not grant access.

    function fingerprintLogin(event) {

      event.preventDefault();

      showMsg(
        "Fingerprint login is not enabled yet. Please log in using email and password.",
        true
      );

    }

  </script>

</body>
</html>
