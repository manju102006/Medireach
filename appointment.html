<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Appointment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    /* ===== Reset & Base ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #c0f7c5, #a0e0ff, #d0f0e0, #a0dfff);
      background-size: 400% 400%;
      animation: gradientFlow 16s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(25px) saturate(180%);
      border-radius: 28px;
      padding: 45px;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 25px 70px rgba(0,0,0,0.6);
      animation: fadeIn 1.2s ease-in-out;
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: "";
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 28px;
      background: linear-gradient(135deg, #f7c0c0, #a0e0ff, #d0f0e0, #a0dfff);
      z-index: -1;
      filter: blur(20px);
      opacity: 0.4;
      animation: borderGlow 6s ease infinite;
    }
    @keyframes borderGlow {
      0%,100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .header { text-align: center; margin-bottom: 35px; }
    .header h1 {
      font-size: 38px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      letter-spacing: 1px;
      color: #0b4a6f;
      text-shadow: 0 0 12px rgba(255,255,255,0.8);
    }
    .header p { font-size: 15px; color: #1f4d3a; margin-top: 10px; }
    .steps { display: flex; justify-content: space-between; margin: 30px 0 45px; position: relative; }
    .steps::before {
      content: "";
      position: absolute; top: 22px; left: 0;
      width: 100%; height: 6px; background: rgba(255,255,255,0.15);
      border-radius: 5px;
    }
    .steps div {
      flex: 1; text-align: center; font-size: 13px; font-weight: 600;
      color: #35616f; position: relative; transition: 0.3s ease;
    }
    .steps div::before {
      content: attr(data-step);
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.5);
      color: #fff; font-weight: bold; transition: 0.3s;
    }
    .steps .active { color: #a0e0ff; transform: scale(1.15); }
    .steps .active::before {
      border-color: #a0e0ff;
      background: linear-gradient(135deg,#c0f7c5,#a0e0ff);
      color: #000;
      box-shadow: 0 0 25px rgba(160,224,255,0.9);
    }
    .input-group { position: relative; margin-bottom: 26px; }
    .input-group input, .input-group select {
      width: 100%; padding: 16px 16px 16px 52px;
      border-radius: 16px; border: 2px solid transparent;
      font-size: 15px; background: rgba(255,255,255,0.1);
      color: #333; transition: all 0.35s ease;
    }
    .input-group input::placeholder { color: transparent; }
    .input-group label {
      position: absolute; top: 16px; left: 52px; font-size: 14px;
      font-weight: 500; color: rgba(0,0,0,0.5); pointer-events: none;
      transition: 0.25s;
    }
    .input-group i {
      position: absolute; left: 18px; top: 16px; font-size: 18px;
      opacity: 0.9; color: #7ed957;
    }
    .input-group input:focus, .input-group select:focus {
      outline: none; background: rgba(255,255,255,0.2);
      border-color: #a0e0ff; box-shadow: 0 0 18px rgba(160,224,255,0.6);
      transform: scale(1.02);
    }
    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label,
    .input-group select:focus + label,
    .input-group select:valid + label {
      top: -10px; left: 42px; font-size: 12px; color: #a0e0ff;
      background: rgba(255,255,255,0.65);
      padding: 0 6px; border-radius: 5px;
    }
    button {
      width: 100%; padding: 15px; font-size: 16px; font-weight: 600;
      border: none; border-radius: 18px; cursor: pointer; position: relative;
      overflow: hidden; transition: all 0.35s ease;
    }
    button::after {
      content: ""; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%,-50%) scale(0);
      width: 300%; height: 300%; background: rgba(255,255,255,0.2);
      border-radius: 50%; transition: transform 0.6s ease;
    }
    button:active::after { transform: translate(-50%,-50%) scale(1); }
    .book-btn { background: linear-gradient(45deg, #c0f7c5, #a0e0ff); color: #000; margin-top: 15px; box-shadow: 0 8px 25px rgba(160,224,255,0.6); }
    .back-btn { background: rgba(255,255,255,0.6); color: #333; margin-top: 12px; }
    .confirm-btn { background: linear-gradient(45deg,#7ed957,#a0e0ff); color:#000; margin-top:18px; }
    .field-error { color:#b91c1c; font-size:13px; margin:-18px 0 18px 6px; display:none; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .preview { margin-top: 25px; padding: 28px; border-radius: 20px; background: rgba(255,255,255,0.8); display: none; animation: fadeIn 0.6s ease-in-out; box-shadow: 0 6px 25px rgba(0,0,0,0.1); border: 1px solid rgba(160,224,255,0.4); color: #333; }
    .preview h3 { margin-bottom: 18px; font-size: 21px; text-align: center; background: linear-gradient(45deg, #c0f7c5, #a0e0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .preview p { margin: 10px 0; font-size: 15px; }
    .success-box { display: none; text-align: center; padding: 30px; border-radius: 22px; background: rgba(255,255,255,0.85); margin-top: 28px; animation: fadeIn 0.8s ease; box-shadow: 0 8px 25px rgba(0,0,0,0.2); color: #333; }
    .success-box h2 { color: #7ed957; margin: 14px 0; text-shadow: 0 0 16px rgba(126,217,87,0.9); }
    .spinner { display: none; margin: 22px auto; border: 6px solid rgba(255,255,255,0.2); border-top: 6px solid #a0e0ff; border-radius: 50%; width: 55px; height: 55px; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 520px) {
      .container { padding: 28px; }
      .header h1 { font-size: 26px; }
      .steps div { font-size: 11px; }
    }
  </style>

  
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCtjfuunPvAKEc-9iBl2VI1D89X4NrhXgE",
    authDomain: "medireach-700fc.firebaseapp.com",
    databaseURL: "https://medireach-700fc-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "medireach-700fc",
    storageBucket: "medireach-700fc.firebasestorage.app",
    messagingSenderId: "946051383153",
    appId: "1:946051383153:web:cf8c290bd8eb5e92e980d0",
    measurementId: "G-S9CKBQHT84"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const auth = firebase.auth();
  const database = firebase.database();
</script>

</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fa-solid fa-calendar-check"></i> Book Appointment</h1>
      <p>Fill in your details to schedule your visit</p>
    </div>

    <div class="steps">
      <div class="active" data-step="1">Details</div>
      <div data-step="2">Preview</div>
      <div data-step="3">Confirm</div>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-user"></i>
      <input type="text" id="name" placeholder="Enter your name" autocomplete="name" required />
      <label for="name">Full Name</label>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-phone"></i>
      <input type="tel" id="phone" placeholder="Enter phone number" maxlength="10" inputmode="numeric" autocomplete="tel-national" required />
      <label for="phone">Phone Number</label>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-venus-mars"></i>
      <select id="gender" required>
        <option value="" disabled selected hidden></option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
      <label for="gender">Gender</label>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-hospital"></i>
      <input type="text" id="hospital" readonly />
      <label for="hospital">Hospital</label>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-stethoscope"></i>
      <input type="text" id="symptom" readonly />
      <label for="symptom">Symptom</label>
    </div>

    <div class="input-group">
      <i class="fa-solid fa-calendar"></i>
      <input type="date" id="date" required />
      <label for="date">Select Date</label>
    </div>

    <div class="input-group">
      <i class="fa-regular fa-clock"></i>
      <input type="time" id="time" required />
      <label for="time">Select Time</label>
    </div>

    <button class="book-btn" onclick="previewAppointment()"><i class="fa-solid fa-eye"></i> Preview Appointment</button>
    <button class="back-btn" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-arrow-left"></i> Back</button>

    <div class="preview" id="previewBox"></div>
    <div class="spinner" id="loadingSpinner"></div>
    <div class="success-box" id="successBox">
      <h2>✅ Appointment Confirmed!</h2>
      <p>Redirecting to payment page...</p>
    </div>
  </div>

  <script>
// Get appointment details from URL
const urlParams = new URLSearchParams(window.location.search);

const hospitalParam = urlParams.get("hospital");
const symptom = urlParams.get("symptom") || "Not specified";

const hospitalInput = document.getElementById("hospital");
hospitalInput.value = hospitalParam || "";

document.getElementById("symptom").value = symptom;

// Allow manual hospital entry if no hospital is passed in URL
if (!hospitalParam) {
  hospitalInput.readOnly = false;
  hospitalInput.required = true;
  hospitalInput.placeholder = "Enter hospital name";
}

// Current logged-in Firebase user
let currentUser = null;

// Escape HTML before displaying user data
const esc = s => String(s).replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

// Get today's date in local format
const todayStr = (() => {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
})();

document.getElementById("date").min = todayStr;

// Phone number validation
document.getElementById("phone").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 10);
});

// Check Firebase authentication
auth.onAuthStateChanged(async user => {
  if (!user) {
    alert("Please login to book an appointment.");
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  // Load the user's profile from Realtime Database
  try {
    const snapshot = await database.ref("users/" + user.uid).once("value");
    const profile = snapshot.val() || {};

    document.getElementById("name").value =
      profile.name || user.displayName || localStorage.getItem("name") || "";

    // Prefill phone only if it exists in the saved profile
    if (profile.phone) {
      document.getElementById("phone").value = profile.phone;
    }
  } catch (error) {
    console.error("Could not load user profile:", error);
    document.getElementById("name").value =
      user.displayName || localStorage.getItem("name") || "";
  }
});

// Update appointment steps
function setStep(stepIndex) {
  document.querySelectorAll(".steps div").forEach((step, i) => {
    step.classList.toggle("active", i <= stepIndex);
  });
}

// Read form values
function readForm() {
  return {
    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    gender: document.getElementById("gender").value,
    hospital: hospitalInput.value.trim(),
    symptom: symptom,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value
  };
}

// Validate appointment details
function validate(a) {
  if (
    !a.name ||
    !a.phone ||
    !a.gender ||
    !a.hospital ||
    !a.date ||
    !a.time
  ) {
    return "Please fill all details before preview.";
  }

  if (a.name.length < 3) {
    return "Please enter your full name (at least 3 characters).";
  }

  if (!/^[6-9]\d{9}$/.test(a.phone)) {
    return "Enter a valid 10-digit Indian mobile number.";
  }

  if (a.date < todayStr) {
    return "Please choose today or a future date.";
  }

  if (a.date === todayStr) {
    const now = new Date();

    const hhmm =
      String(now.getHours()).padStart(2, "0") +
      ":" +
      String(now.getMinutes()).padStart(2, "0");

    if (a.time <= hhmm) {
      return "Please choose a time later than the current time.";
    }
  }

  return "";
}

// Show appointment preview
function previewAppointment() {
  if (!currentUser) {
    alert("Please wait while your account is loading.");
    return;
  }

  const a = readForm();
  const err = validate(a);

  if (err) {
    alert("⚠ " + err);
    return;
  }

  const previewBox = document.getElementById("previewBox");

  previewBox.style.display = "block";

  previewBox.innerHTML = `
    <h3>📋 Appointment Preview</h3>

    <p><strong>Name:</strong> ${esc(a.name)}</p>
    <p><strong>Phone:</strong> ${esc(a.phone)}</p>
    <p><strong>Gender:</strong> ${esc(a.gender)}</p>
    <p><strong>Hospital:</strong> ${esc(a.hospital)}</p>
    <p><strong>Symptom:</strong> ${esc(a.symptom)}</p>
    <p><strong>Date:</strong> ${esc(a.date)}</p>
    <p><strong>Time:</strong> ${esc(a.time)}</p>

    <button type="button" class="confirm-btn" id="confirmBtn">
      ✅ Confirm & Book
    </button>
  `;

  document.getElementById("confirmBtn")
    .addEventListener("click", bookAppointment);

  setStep(1);

  previewBox.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });
}

// Save appointment in Firebase
async function bookAppointment() {
  const user = auth.currentUser;

  if (!user) {
    alert("Your login session has expired. Please login again.");
    window.location.href = "login.html";
    return;
  }

  const a = readForm();
  const err = validate(a);

  if (err) {
    alert("⚠ " + err);
    return;
  }

  const btn = document.getElementById("confirmBtn");
  const spinner = document.getElementById("loadingSpinner");

  btn.disabled = true;
  spinner.style.display = "block";

  // Appointment record
  const record = {
    uid: user.uid,
    name: a.name,
    email: user.email || "",
    phone: a.phone,
    gender: a.gender,
    hospital: a.hospital,
    symptom: a.symptom,
    date: a.date,
    time: a.time,
    status: "booked",
    paymentStatus: "pending",
    createdAt: new Date().toISOString()
  };

  try {
    // Save under the currently logged-in user's UID
    const appointmentRef = database
      .ref("appointments/" + user.uid)
      .push();

    await appointmentRef.set(record);

    spinner.style.display = "none";
    document.getElementById("successBox").style.display = "block";

    setStep(2);

    // Send appointment details to payment page
    // Redirect to payment page with the saved appointment ID
const paymentURL = new URL("./pay.html", document.baseURI);

paymentURL.searchParams.set("id", appointmentRef.key);

console.log("Payment redirect URL:", paymentURL.href);

setTimeout(() => {
  window.location.assign(paymentURL.href);
}, 2000);

  } catch (error) {
    console.error("Appointment saving error:", error);

    spinner.style.display = "none";
    btn.disabled = false;

    alert("❌ Could not save the appointment: " + error.message);
  }
}
</script>
</body>
</html>
