
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Hospitals in Tamil Nadu</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css">

  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css">

  <style>
    :root {
      --primary: #007BFF;
      --primary-2: #00c6ff;
      --success: #28a745;
      --danger: #dc3545;
      --text: #1e2630;
      --muted: #6b7280;
      --glass-bg: rgba(255,255,255,0.78);
      --glass-br: 14px;
      --shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at -10% -10%, rgba(0,123,255,.10), transparent 50%),
        radial-gradient(1000px 600px at 110% 10%, rgba(0,198,255,.12), transparent 50%),
        linear-gradient(135deg, #f5faff, #eaf4ff 40%, #eef9ff);
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1001;
      background: rgba(255,255,255,.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,.06);
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #fff, #f6fbff);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 4px 14px rgba(0,0,0,.06);
      font-weight: 600;
      color: #0d1b2a;
    }

    .pill .label {
      color: var(--muted);
      font-weight: 500;
    }

    h2.title {
      text-align: center;
      margin: 10px 0 8px;
      font-size: clamp(18px, 3.5vw, 26px);
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: .2px;
    }

    .layout {
      display: flex;
      height: calc(100vh - 90px);
      min-height: 500px;
    }

    #sidebar {
      width: 320px;
      flex-shrink: 0;
      overflow-y: auto;
      background: var(--glass-bg);
      border-right: 1px solid rgba(0,0,0,.06);
      backdrop-filter: blur(12px);
      padding: 16px;
      border-radius: 0 var(--glass-br) var(--glass-br) 0;
      box-shadow: 6px 0 24px rgba(0,0,0,.06);
    }

    #sidebar h3 {
      margin: 6px 0 12px;
      font-size: 18px;
      font-weight: 800;
      color: #0d1b2a;
    }

    #searchBox {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,.1);
      outline: none;
      transition: .25s;
      font-size: 14px;
      background: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
    }

    #searchBox:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0,123,255,.12);
    }

    #hospitalList {
      list-style: none;
      padding: 0;
      margin: 12px 0 0;
    }

    #hospitalList li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      background: #fff;
      border: 1px solid rgba(0,0,0,.06);
      margin: 8px 0;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
      transition: .18s ease;
    }

    #hospitalList li:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(0,0,0,.10);
      border-color: rgba(0,123,255,.25);
    }

    .h-name {
      flex: 1;
      font-weight: 700;
      color: #0f172a;
      cursor: pointer;
    }

    .h-distance {
      font-size: 12px;
      color: #865300;
      background: #fff5d6;
      border: 1px solid #ffe6a7;
      padding: 3px 6px;
      border-radius: 999px;
      display: inline-block;
      margin-top: 6px;
    }

    #hospitalList button {
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      border: none;
      color: #fff;
      font-weight: 700;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: .25s;
      box-shadow: 0 6px 16px rgba(0,123,255,.25);
      white-space: nowrap;
    }

    #hospitalList button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(0,123,255,.35);
    }

    #map {
      position: relative;
      height: 100%;
      width: 100%;
      min-width: 0;
      z-index: 1;
      border-top-left-radius: var(--glass-br);
    }

    .fab {
      position: absolute;
      top: 14px;
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 12px;
      z-index: 1000;
      border: none;
      cursor: pointer;
      transition: .25s;
      color: #fff;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    #fullInstructionsBtn {
      left: 20px;
      background: linear-gradient(90deg, #22c55e, #31d977);
    }

    #stopVoiceBtn {
      left: 180px;
      background: linear-gradient(90deg, var(--danger), #ff6b81);
    }

    .fab:hover {
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 12px 26px rgba(0,0,0,.18);
    }

    #directionsBox {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--glass-bg);
      border: 1px solid rgba(0,0,0,.06);
      padding: 14px 16px;
      max-width: 320px;
      max-height: 40%;
      overflow-y: auto;
      border-radius: 14px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      font-size: 14px;
      z-index: 999;
      display: none;
      color: #0f172a;
    }

    #directionsBox ul {
      padding-left: 18px;
      margin: 8px 0 0;
    }

    #directionsBox a {
      text-decoration: none;
      background: linear-gradient(90deg, var(--success), #34d058);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-weight: 700;
      display: inline-block;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(40,167,69,.25);
    }

    #statusMessage {
      color: var(--muted);
      font-size: 13px;
      padding: 12px 4px;
    }

    .leaflet-control-container .leaflet-routing-container {
      background: var(--glass-bg);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    @media (max-width: 820px) {
      .layout {
        display: flex;
        flex-direction: column;
        height: auto;
      }

      #sidebar {
        width: 100%;
        height: 280px;
        border-radius: 0;
        box-shadow: 0 8px 26px rgba(0,0,0,.08);
      }

      #map {
        height: 70vh;
        min-height: 450px;
        border-radius: 0;
      }

      #fullInstructionsBtn {
        top: 10px;
        left: 10px;
      }

      #stopVoiceBtn {
        top: 60px;
        left: 10px;
      }

      #directionsBox {
        left: 10px;
        right: 10px;
        max-width: unset;
        bottom: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="pill">
      <span class="label">Symptom:</span>
      <span id="symptomName">Not specified</span>
    </div>

    <div class="pill">
      <span class="label">Book Appointment at:</span>
      <span id="hospitalName">Hospital</span>
    </div>
  </div>

  <h2 class="title">Nearby Hospitals (Tamil Nadu)</h2>

  <div class="layout">

    <!-- Sidebar -->
    <div id="sidebar">
      <h3>Nearby Hospitals</h3>

      <input
        type="text"
        id="searchBox"
        placeholder="Search hospital..."
        aria-label="Search hospitals"
      >

      <p id="statusMessage">Detecting your location...</p>

      <ul id="hospitalList"></ul>
    </div>

    <!-- Map -->
    <div id="map">

      <div id="directionsBox"></div>

      <button
        id="fullInstructionsBtn"
        class="fab"
        type="button"
        onclick="toggleFullInstructions()"
      >
        📋 Full Instructions
      </button>

      <button
        id="stopVoiceBtn"
        class="fab"
        type="button"
        onclick="stopVoice()"
      >
        🔇 Stop Voice
      </button>

    </div>
  </div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Routing Machine JavaScript -->
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.min.js"></script>

  <script>
    // Read URL parameters
    const urlParams = new URLSearchParams(window.location.search);

    const symptom =
      urlParams.get("symptom") || "Not specified";

    const selectedHospitalFromQuery =
      urlParams.get("hospital");

    document.getElementById("symptomName").textContent = symptom;

    if (selectedHospitalFromQuery) {
      document.getElementById("hospitalName").textContent =
        selectedHospitalFromQuery;
    }

    // Global variables
    let routingControl = null;
    let userLat = null;
    let userLon = null;
    let userMarker = null;
    let locationWatchId = null;
    let fullInstructionList = [];
    let showingFullInstructions = false;
    let hospitalData = [];

    // Map initialization
    const map = L.map("map").setView([11.1271, 78.6569], 8);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    // Custom icons
    const userIcon = L.icon({
      iconUrl:
        "https://cdn-icons-png.flaticon.com/512/149/149071.png",
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -30]
    });

    const hospitalIcon = L.icon({
      iconUrl:
        "https://cdn-icons-png.flaticon.com/512/1686/1686934.png",
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -30]
    });

    // Check Tamil Nadu coordinates
    function isInTamilNadu(lat, lon) {
      return (
        lat >= 8.0 &&
        lat <= 13.5 &&
        lon >= 76.0 &&
        lon <= 80.5
      );
    }

    // Safe HTML output
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    // Stop voice navigation
    function stopVoice() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    // Speak navigation instruction
    function speakStep(text) {
      if (!("speechSynthesis" in window) || !text) {
        return;
      }

      stopVoice();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";

      window.speechSynthesis.speak(utterance);
    }

    // Convert meters to readable distance
    function formatDistance(distance) {
      if (distance < 1000) {
        return Math.round(distance) + " m away";
      }

      return (distance / 1000).toFixed(1) + " km away";
    }

    // Get coordinates from OSM node or way/relation
    function getHospitalCoordinates(place) {
      if (
        typeof place.lat === "number" &&
        typeof place.lon === "number"
      ) {
        return {
          lat: place.lat,
          lon: place.lon
        };
      }

      if (
        place.center &&
        typeof place.center.lat === "number" &&
        typeof place.center.lon === "number"
      ) {
        return {
          lat: place.center.lat,
          lon: place.center.lon
        };
      }

      return null;
    }

    // Display hospital list and map markers
    function displayHospitals(elements) {
      const listEl = document.getElementById("hospitalList");

      listEl.replaceChildren();
      hospitalData = [];

      elements.forEach(place => {
        const coordinates = getHospitalCoordinates(place);

        if (!coordinates) return;

        const name =
          place.tags && place.tags.name
            ? place.tags.name
            : "Unnamed Hospital";

        const distance = L.latLng(userLat, userLon)
          .distanceTo(
            L.latLng(coordinates.lat, coordinates.lon)
          );

        const marker = L.marker(
          [coordinates.lat, coordinates.lon],
          { icon: hospitalIcon }
        ).addTo(map);

        marker.bindPopup(
          `<strong>${escapeHtml(name)}</strong><br>
           ${formatDistance(distance)}`
        );

        const hospital = {
          name,
          lat: coordinates.lat,
          lon: coordinates.lon,
          distance,
          marker
        };

        hospitalData.push(hospital);
      });

      // Sort by actual distance
      hospitalData.sort((a, b) => a.distance - b.distance);

      hospitalData.forEach(place => {
        const li = document.createElement("li");

        const leftWrap = document.createElement("div");
        leftWrap.style.display = "flex";
        leftWrap.style.flexDirection = "column";
        leftWrap.style.gap = "6px";
        leftWrap.style.flex = "1";

        const nameSpan = document.createElement("span");
        nameSpan.className = "h-name";
        nameSpan.textContent = place.name;

        const distanceSpan = document.createElement("span");
        distanceSpan.className = "h-distance";
        distanceSpan.textContent =
          formatDistance(place.distance);

        leftWrap.appendChild(nameSpan);
        leftWrap.appendChild(distanceSpan);

        nameSpan.addEventListener("click", () => {
          map.setView([place.lat, place.lon], 15);
          place.marker.openPopup();
        });

        const directionBtn = document.createElement("button");
        directionBtn.type = "button";
        directionBtn.textContent = "➡ Directions";

        directionBtn.addEventListener("click", () => {
          showDirections(place);
        });

        li.appendChild(leftWrap);
        li.appendChild(directionBtn);

        listEl.appendChild(li);
      });

      document.getElementById("statusMessage").textContent =
        hospitalData.length
          ? `${hospitalData.length} hospitals found.`
          : "No hospitals found nearby.";
    }

    // Fetch nearby hospitals using Overpass API
    async function fetchHospitals() {
      const statusMessage =
        document.getElementById("statusMessage");

      statusMessage.textContent =
        "Searching nearby hospitals...";

      const query = `
        [out:json];
        (
          node["amenity"="hospital"](around:5000,${userLat},${userLon});
          way["amenity"="hospital"](around:5000,${userLat},${userLon});
          relation["amenity"="hospital"](around:5000,${userLat},${userLon});
        );
        out center;
      `;

      try {
        const response = await fetch(
          "https://overpass-api.de/api/interpreter?data=" +
          encodeURIComponent(query)
        );

        if (!response.ok) {
          throw new Error("Hospital data request failed.");
        }

        const data = await response.json();

        if (!data.elements || !data.elements.length) {
          statusMessage.textContent =
            "No hospitals found within 5 km.";
          return;
        }

        displayHospitals(data.elements);

      } catch (error) {
        console.error("Hospital fetching error:", error);

        statusMessage.textContent =
          "Unable to load hospitals. Please try again later.";
      }
    }

    // Show route to selected hospital
    function showDirections(place) {
      if (userLat === null || userLon === null) {
        alert("Your current location is unavailable.");
        return;
      }

      if (routingControl) {
        map.removeControl(routingControl);
        routingControl = null;
      }

      stopVoice();

      const directionsBox =
        document.getElementById("directionsBox");

      directionsBox.style.display = "block";
      directionsBox.innerHTML = "<em>Loading route...</em>";

      fullInstructionList = [];
      showingFullInstructions = false;

      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(userLat, userLon),
          L.latLng(place.lat, place.lon)
        ],

        routeWhileDragging: false,
        show: false,

        createMarker: function() {
          return null;
        }
      });

      routingControl.on("routesfound", function(event) {
        const route = event.routes[0];

        const instructions = route.instructions || [];

        fullInstructionList =
          instructions.map(step => step.text);

        if (instructions.length > 0) {
          speakStep(instructions[0].text);
        }

        const firstInstruction =
          instructions.length > 0
            ? instructions[0].text
            : "Route ready.";

        directionsBox.innerHTML = `
          <strong>Next Step:</strong><br>
          ${escapeHtml(firstInstruction)}
          <br><br>
          <a href="appointment.html?hospital=${encodeURIComponent(place.name)}&symptom=${encodeURIComponent(symptom)}">
            ✅ Book Appointment
          </a>
        `;

      });

      routingControl.on("routingerror", function() {
        directionsBox.textContent =
          "Unable to find a route. Please try again.";
      });

      routingControl.addTo(map);
    }

    // Update navigation based on current position
    function updateNavigation(currentLat, currentLon) {
      if (!fullInstructionList.length) return;

      // The route's instruction objects are available after routing.
      // Recalculate route instructions through the route event.
      if (currentRouteInstructions.length === 0) return;

      const userPosition = L.latLng(currentLat, currentLon);
      const nextInstruction =
        currentRouteInstructions[currentStep];

      if (!nextInstruction) return;

      const distance = userPosition.distanceTo(
        nextInstruction.latLng
      );

      if (
        distance < 25 &&
        currentStep < currentRouteInstructions.length - 1
      ) {
        currentStep++;
        speakStep(currentRouteInstructions[currentStep].text);
      }

      if (!showingFullInstructions) {
        document.getElementById("directionsBox").innerHTML =
          `<strong>Next Step:</strong><br>
          ${escapeHtml(
            currentRouteInstructions[currentStep]?.text ||
            "Route ready"
          )}`;
      }
    }

    // Navigation state
    let currentRouteInstructions = [];
    let currentStep = 0;

    // Live route instruction updates
    function attachRouteNavigation() {
      if (!routingControl) return;

      routingControl.on("routesfound", function(event) {
        currentRouteInstructions =
          event.routes[0].instructions || [];

        currentStep = 0;
      });
    }

    // Search hospital list
    document.getElementById("searchBox")
      .addEventListener("input", function() {
        const query = this.value.toLowerCase();

        const items =
          document.querySelectorAll("#hospitalList li");

        items.forEach(item => {
          const match =
            item.textContent.toLowerCase().includes(query);

          item.style.display = match ? "" : "none";
        });
      });

    // Full instruction toggle
    function toggleFullInstructions() {
      const box =
        document.getElementById("directionsBox");

      if (!box || box.style.display === "none") return;

      if (!showingFullInstructions) {
        box.innerHTML = `
          <strong>Full Instructions:</strong>
          <br>
          <ul>
            ${
              fullInstructionList.length
                ? fullInstructionList.map(step =>
                    `<li>${escapeHtml(step)}</li>`
                  ).join("")
                : "<li>No turn-by-turn data available.</li>"
            }
          </ul>
        `;
      } else {
        const nextStep =
          currentRouteInstructions[currentStep]?.text ||
          "Route ready";

        box.innerHTML = `
          <strong>Next Step:</strong><br>
          ${escapeHtml(nextStep)}
        `;
      }

      showingFullInstructions = !showingFullInstructions;
    }

    // Get current location
    function startLocationTracking() {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async function(position) {
          userLat = position.coords.latitude;
          userLon = position.coords.longitude;

          if (!isInTamilNadu(userLat, userLon)) {
            alert("You are not in Tamil Nadu.");
            document.getElementById("statusMessage").textContent =
              "Location is outside Tamil Nadu.";
            return;
          }

          map.setView([userLat, userLon], 14);

          userMarker = L.marker(
            [userLat, userLon],
            { icon: userIcon }
          )
            .addTo(map)
            .bindPopup("You are here")
            .openPopup();

          await fetchHospitals();

          // Track user location while navigating
          locationWatchId = navigator.geolocation.watchPosition(
            function(position) {
              userLat = position.coords.latitude;
              userLon = position.coords.longitude;

              if (userMarker) {
                userMarker.setLatLng([userLat, userLon]);
              }

              updateNavigation(userLat, userLon);
            },

            function(error) {
              console.warn("Location tracking error:", error.message);
            },

            {
              enableHighAccuracy: true,
              maximumAge: 5000,
              timeout: 15000
            }
          );
        },

        function(error) {
          console.error("Geolocation error:", error);

          alert(
            "Location access denied or unavailable. Please allow location access."
          );

          document.getElementById("statusMessage").textContent =
            "Location detection failed.";
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    // Start application
    startLocationTracking();

    // Make functions accessible to HTML buttons
    window.toggleFullInstructions = toggleFullInstructions;
    window.stopVoice = stopVoice;

  </script>
</body>
</html>
