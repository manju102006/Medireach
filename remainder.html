<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Reminder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        .calendar-day {
            transition: background-color 0.3s, transform 0.2s;
        }
        .calendar-day:hover {
            background-color: #e0f2fe;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl p-6">
        <a href="dashboard.html" class="text-blue-700 underline text-sm">← Back to Dashboard</a>
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Medication Reminder</h1>

        <!-- Morning / Afternoon / Night Panels -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <!-- Morning -->
            <div class="bg-blue-50 p-4 rounded-lg">
                <h2 class="text-xl font-semibold text-blue-700">Morning</h2>
                <div class="mt-2">
                    <label class="block text-sm font-medium text-gray-700">Time</label>
                    <input type="time" id="morningTime" value="08:00" class="w-full p-2 border rounded-md">
                    <label class="block text-sm font-medium text-gray-700 mt-2">Medication</label>
                    <input type="text" id="morningMed" placeholder="Enter medication" class="w-full p-2 border rounded-md">
                    <div class="flex gap-2 mt-2">
                        <button onclick="addMedication('morning')" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Add</button>
                        <button onclick="startVoiceInput('morningMed')" class="voice-btn bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">Voice</button>
                    </div>
                </div>
                <ul id="morningList" class="mt-4 space-y-2"></ul>
            </div>

            <!-- Afternoon -->
            <div class="bg-green-50 p-4 rounded-lg">
                <h2 class="text-xl font-semibold text-green-700">Afternoon</h2>
                <div class="mt-2">
                    <label class="block text-sm font-medium text-gray-700">Time</label>
                    <input type="time" id="afternoonTime" value="13:00" class="w-full p-2 border rounded-md">
                    <label class="block text-sm font-medium text-gray-700 mt-2">Medication</label>
                    <input type="text" id="afternoonMed" placeholder="Enter medication" class="w-full p-2 border rounded-md">
                    <div class="flex gap-2 mt-2">
                        <button onclick="addMedication('afternoon')" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">Add</button>
                        <button onclick="startVoiceInput('afternoonMed')" class="voice-btn bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">Voice</button>
                    </div>
                </div>
                <ul id="afternoonList" class="mt-4 space-y-2"></ul>
            </div>

            <!-- Night -->
            <div class="bg-purple-50 p-4 rounded-lg">
                <h2 class="text-xl font-semibold text-purple-700">Night</h2>
                <div class="mt-2">
                    <label class="block text-sm font-medium text-gray-700">Time</label>
                    <input type="time" id="nightTime" value="20:00" class="w-full p-2 border rounded-md">
                    <label class="block text-sm font-medium text-gray-700 mt-2">Medication</label>
                    <input type="text" id="nightMed" placeholder="Enter medication" class="w-full p-2 border rounded-md">
                    <div class="flex gap-2 mt-2">
                        <button onclick="addMedication('night')" class="bg-purple-600 text-white px-4 py-2 rounded-md hover:bg-purple-700">Add</button>
                        <button onclick="startVoiceInput('nightMed')" class="voice-btn bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">Voice</button>
                    </div>
                </div>
                <ul id="nightList" class="mt-4 space-y-2"></ul>
            </div>
        </div>

        <!-- Weekly Schedule -->
        <div class="bg-gray-50 p-4 rounded-lg overflow-x-auto">
            <h2 class="text-xl font-semibold text-gray-800 mb-4 text-center">Weekly Schedule</h2>
            <table class="w-full border border-green-400 rounded-lg overflow-hidden shadow">
                <thead>
                    <tr class="bg-green-100 text-green-800">
                        <th class="border border-green-400 px-4 py-2">Day</th>
                        <th class="border border-green-400 px-4 py-2">Morning</th>
                        <th class="border border-green-400 px-4 py-2">Afternoon</th>
                        <th class="border border-green-400 px-4 py-2">Night</th>
                    </tr>
                </thead>
                <tbody id="calendarTable"></tbody>
            </table>
        </div>

        <!-- Beep Alarm -->
        <audio id="reminderSound" src="beep-alarm-366507.mp3" preload="auto"></audio>
        <p class="text-xs text-gray-500 text-center mt-4">Reminders ring only while this page is open in your browser.</p>

        <script>
            let schedules = {
                morning: [],
                afternoon: [],
                night: []
            };

            // Load saved schedules
            try {
                const saved = JSON.parse(localStorage.getItem('medicationSchedules'));
                if (saved && saved.morning && saved.afternoon && saved.night) schedules = saved;
            } catch (e) { console.warn('Ignoring corrupt saved schedule', e); }
            const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            renderSchedules();
            renderCalendar();

            // Voice input setup
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.lang = 'en-US';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    const inputId = recognition.currentInputId;
                    document.getElementById(inputId).value = transcript;
                };

                recognition.onerror = function(event) {
                    console.error('Speech recognition error:', event.error);
                    if (event.error !== 'no-speech' && event.error !== 'aborted') alert('Voice input error: ' + event.error);
                };
            } else {
                document.querySelectorAll('.voice-btn').forEach(btn => btn.style.display = 'none');
            }

            function startVoiceInput(inputId) {
                if (recognition) {
                    recognition.currentInputId = inputId;
                    try { recognition.start(); } catch (e) { /* already listening */ }
                }
            }

            // Text-to-speech
            function speak(text) {
                if (!('speechSynthesis' in window)) return;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 1;
                window.speechSynthesis.speak(utterance);
            }

            // Convert 24-hour time to 12-hour format
            function to12HourFormat(time) {
                const [hours, minutes] = time.split(':').map(Number);
                const period = hours >= 12 ? 'PM' : 'AM';
                const adjustedHours = hours % 12 || 12;
                return `${adjustedHours}:${minutes.toString().padStart(2, '0')} ${period}`;
            }

            function addMedication(period) {
                const timeInput = document.getElementById(`${period}Time`).value;
                const medInput = document.getElementById(`${period}Med`).value.trim();
                if (!timeInput || !medInput) {
                    alert('Please enter both time and medication.');
                    return;
                }

                const id = Date.now();
                schedules[period].push({ id, time: timeInput, medication: medInput, reminder: true });
                schedules[period].sort((a, b) => a.time.localeCompare(b.time));
                localStorage.setItem('medicationSchedules', JSON.stringify(schedules));
                renderSchedules();
                renderCalendar();
                document.getElementById(`${period}Med`).value = '';
            }

            function toggleReminder(period, id) {
                const med = schedules[period].find(item => item.id === id);
                if (med) {
                    med.reminder = !med.reminder;
                    localStorage.setItem('medicationSchedules', JSON.stringify(schedules));
                    renderSchedules();
                }
            }

            function deleteMedication(period, id) {
                schedules[period] = schedules[period].filter(item => item.id !== id);
                localStorage.setItem('medicationSchedules', JSON.stringify(schedules));
                renderSchedules();
                renderCalendar();
            }

            function renderSchedules() {
                ['morning', 'afternoon', 'night'].forEach(period => {
                    const list = document.getElementById(`${period}List`);
                    list.innerHTML = '';
                    schedules[period].forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'fade-in bg-white p-2 rounded-md shadow flex justify-between items-center';
                        li.innerHTML = `
                            <div>
                                <span class="font-semibold">${to12HourFormat(item.time)}</span> - ${esc(item.medication)}
                            </div>
                            <div class="flex gap-2">
                                <button onclick="toggleReminder('${period}', ${item.id})" 
                                    class="${item.reminder ? 'bg-green-500 hover:bg-green-600' : 'bg-gray-400 hover:bg-gray-500'} text-white px-2 py-1 rounded-md">🔔</button>
                                <button onclick="deleteMedication('${period}', ${item.id})" 
                                    class="bg-red-500 text-white px-2 py-1 rounded-md hover:bg-red-600">Del</button>
                            </div>`;
                        list.appendChild(li);
                    });
                });
            }

            function renderCalendar() {
                const calendarTable = document.getElementById('calendarTable');
                calendarTable.innerHTML = '';
                const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

                days.forEach(day => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-green-50";

                    const dayCell = document.createElement('td');
                    dayCell.className = "border border-green-300 px-4 py-2 font-semibold text-green-700";
                    dayCell.textContent = day;
                    tr.appendChild(dayCell);

                    ['morning', 'afternoon', 'night'].forEach(period => {
                        const td = document.createElement('td');
                        td.className = "border border-green-300 px-4 py-2 text-sm text-gray-700";
                        const meds = schedules[period].map(item => `${to12HourFormat(item.time)} - ${esc(item.medication)}`);
                        td.innerHTML = meds.length ? meds.join("<br>") : '<span class="text-gray-400 italic">No meds</span>';
                        tr.appendChild(td);
                    });

                    calendarTable.appendChild(tr);
                });
            }

            // Beep fallback: the mp3 referenced above is not in the project, so synthesise a beep.
            function beep() {
                const el = document.getElementById('reminderSound');
                el.currentTime = 0;
                el.play().catch(() => {
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        osc.frequency.value = 880; osc.connect(ctx.destination);
                        osc.start(); osc.stop(ctx.currentTime + 0.6);
                    } catch (e) { console.warn('No audio available', e); }
                });
            }

            // Poll every 15 s (a 60 s interval can skip a whole minute); fire each reminder once per minute.
            const fired = new Set();
            setInterval(() => {
                const now = new Date();
                const stamp = now.toDateString() + ' ' + now.toTimeString().slice(0, 5);
                const currentTime = now.toTimeString().slice(0, 5);
                ['morning', 'afternoon', 'night'].forEach(period => {
                    schedules[period].forEach(item => {
                        const key = item.id + '|' + stamp;
                        if (item.reminder && item.time === currentTime && !fired.has(key)) {
                            fired.add(key);
                            beep();
                            const text = `Time to take your ${period} medication: ${item.medication}`;
                            if ('Notification' in window && Notification.permission === 'granted') new Notification(text);
                            speak(text);
                        }
                    });
                });
            }, 15000);

            // Ask for notification permission on load
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        </script>
    </div>
</body>
</html>
